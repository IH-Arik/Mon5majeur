version: "3.9"

services:
  # Self-hosted MongoDB (Optional: remove/disable if using MongoDB Atlas)
  mongodb:
    image: mongo:6.0
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-mon5majeur_db}
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: mon5majeur-api:${TAG:-latest}
    build: .
    restart: always
    env_file: .env.prod
    expose:
      - "8000"
    volumes:
      - ./uploads:/app/uploads
    # If using local MongoDB, depend on it. If using Atlas, this can be safely removed.
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mongodb_prod_data:
